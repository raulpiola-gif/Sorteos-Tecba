<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteos Tecba</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-logo">
                <svg viewBox="0 0 120 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="tecba-logo">
                    <text x="0" y="22" font-family="Archivo, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">tecba</text>
                    <rect x="78" y="6" width="4" height="4" rx="1" fill="#009688"/>
                    <rect x="84" y="6" width="4" height="4" rx="1" fill="#E88700"/>
                    <rect x="90" y="6" width="4" height="4" rx="1" fill="#035C80"/>
                    <rect x="78" y="12" width="4" height="4" rx="1" fill="#E88700"/>
                    <rect x="84" y="12" width="4" height="4" rx="1" fill="#009688"/>
                    <rect x="90" y="12" width="4" height="4" rx="1" fill="#009688"/>
                </svg>
            </div>
            <h1>SORTEOS TECBA</h1>
            <p class="subtitle">Agrega participantes y descubre al ganador</p>
        </header>

        <main class="main-card glass-card">
            <!-- Input Section -->
            <section class="input-section">
                <label class="section-label">AGREGAR PARTICIPANTE</label>
                <div class="input-row">
                    <input
                        type="text"
                        id="nameInput"
                        class="text-input"
                        placeholder="Escribe un nombre..."
                        maxlength="50"
                        autocomplete="off"
                    >
                    <button id="micBtn" class="btn-mic" title="Agregar por voz">
                        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        <span class="mic-status" id="micStatus"></span>
                    </button>
                    <button id="addBtn" class="btn btn-add" title="Agregar participante">
                        <span class="btn-icon">+</span>
                        <span class="btn-text">Agregar</span>
                    </button>
                </div>
            </section>

            <!-- Participants Tags -->
            <section class="participants-section">
                <div class="section-header">
                    <label class="section-label">PARTICIPANTES</label>
                    <span id="participantCount" class="badge">0</span>
                </div>
                <div id="tagsContainer" class="tags-container">
                    <p class="empty-message" id="emptyMessage">Agrega participantes para comenzar</p>
                </div>
                <div class="import-row">
                    <label class="btn btn-import" for="csvInput">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Importar lista
                    </label>
                    <input type="file" id="csvInput" accept=".csv,.txt,.xlsx,.xls" hidden>
                    <span class="import-hint">CSV o TXT (un nombre por linea, max 100)</span>
                </div>
            </section>

            <!-- Winners Config -->
            <section class="config-section">
                <label class="section-label">NUMERO DE GANADORES</label>
                <div class="number-control">
                    <button id="decreaseBtn" class="btn-number" disabled>&#8722;</button>
                    <span id="winnerCount" class="number-display">1</span>
                    <button id="increaseBtn" class="btn-number">+</button>
                </div>
            </section>

            <!-- Odometer Display -->
            <section class="odometer-section" id="odometerSection">
                <div class="odometer-display">
                    <div class="odometer-overlay top"></div>
                    <div class="odometer-overlay bottom"></div>
                    <div class="odometer-viewport" id="odometerViewport">
                        <div class="odometer-item">---</div>
                        <div class="odometer-item center">---</div>
                        <div class="odometer-item">---</div>
                    </div>
                </div>
            </section>

            <!-- Action Button -->
            <button id="raffleBtn" class="btn btn-raffle" disabled>
                <span class="btn-raffle-text">SORTEAR</span>
            </button>

            <!-- Result Section -->
            <section class="result-section hidden" id="resultSection">
                <div class="result-header">
                    <span class="result-title">GANADOR</span>
                </div>
                <div class="result-winners" id="resultWinners"></div>
            </section>

            <!-- Clear Button -->
            <button id="clearBtn" class="btn btn-clear">
                Limpiar Sorteo
            </button>

            <!-- Save Section -->
            <section class="save-section" id="saveSection">
                <div class="save-row">
                    <input
                        type="text"
                        id="raffleNameInput"
                        class="text-input"
                        placeholder="Nombre del sorteo..."
                        maxlength="50"
                    >
                    <button id="saveBtn" class="btn btn-save" title="Guardar sorteo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17 21 17 13 7 13 7 21"/>
                            <polyline points="7 3 7 8 15 8"/>
                        </svg>
                        Guardar
                    </button>
                </div>
            </section>
        </main>

        <!-- Past Raffles Panel -->
        <section class="past-raffles glass-card" id="pastRafflesSection">
            <div class="section-header">
                <label class="section-label">SORTEOS GUARDADOS</label>
                <span id="raffleCount" class="badge">0</span>
            </div>
            <div id="rafflesList" class="raffles-list">
                <p class="empty-message">No hay sorteos guardados</p>
            </div>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
